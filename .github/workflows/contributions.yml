name: Update contribution graph

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: make install

      - name: Generate contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: make generate

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          HASH=$(git rev-parse --short HEAD)
          NEW_NAME="contributions_${HASH}.png"
          CURRENT=$(git ls-files 'contributions_*.png' | head -1)

          if [ -n "$CURRENT" ] && cmp -s contributions.png "$CURRENT"; then
            echo "No changes to commit"
            rm contributions.png
          else
            [ -n "$CURRENT" ] && git rm -f "$CURRENT"
            mv contributions.png "$NEW_NAME"
            git add "$NEW_NAME"
            sed -i -E "s|contributions_[a-f0-9]{7}\.png|${NEW_NAME}|g" README.md
            git add README.md
            git commit -m "chore: update contribution graph [${HASH}]"
            git push
          fi
